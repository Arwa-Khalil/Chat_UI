<div class="shell">
  <nav class="topbar">
    <div class="brand">
      <div class="logo">AI</div>
      <div class="brand-text">
        <div class="name">Chat Studio</div>
        <div class="subtitle">Smart Q&amp;A • File RAG • Beautiful UI</div>
      </div>
    </div>

    <div class="controls">
      <button class="tab" [class.active]="view==='chat'" (click)="setView('chat')">Chat</button>
      <button class="tab" [class.active]="view==='upload'" (click)="setView('upload')">Upload</button>
      <a class="ghost" href="#" (click)="$event.preventDefault()">Docs</a>
    </div>
  </nav>

  <main class="main-area">
    <section class="panel left">
      <div class="panel-card">
        <h3 class="panel-title">Workspace</h3>
        <p class="muted">Switch between Chat and File Upload. Use uploaded docs to augment answers.</p>

        <ul class="quick-nav">
          <li (click)="setView('chat')" [class.selected]="view==='chat'">💬 Chat (ask questions)</li>
          <li (click)="setView('upload')" [class.selected]="view==='upload'">📁 Upload files</li>
        </ul>
      </div>
    </section>

    <section class="panel right">
      <div class="card content-card" [@fadeSwitch]="animationState">
        <ng-container *ngIf="view === 'chat'">
          <app-chat></app-chat>
        </ng-container>

        <ng-container *ngIf="view === 'upload'">
          <app-file-upload></app-file-upload>
        </ng-container>
      </div>
    </section>
  </main>

  <footer class="footer">© Chat Studio — Modern RAG demo</footer>
</div>
